; =====================================================================
;  Feijao com Farinha - robo movel com voz, escuta, camera e movimento
;
;  DUAS PLACAS, UM REPOSITORIO
;
;  Ambiente    Placa                 Para que serve
;  ----------  --------------------  ---------------------------------
;  corpo       ESP32-C3 SuperMini    motores, servos, UART e failsafe
;  cerebro     XIAO ESP32-S3 Sense   camera, mic, audio, Wi-Fi, decisao
;  bancada     ESP32-C3 SuperMini    o corpo com log detalhado
;  autoteste   ESP32-C3 SuperMini    a logica das duas, sem hardware
;
;  Por que um projeto so e nao dois: o `protocolo.h` e compilado nas
;  DUAS placas. Separar em dois projetos obrigaria a copiar esse
;  arquivo, e protocolo copiado e protocolo que diverge - um lado
;  passa a acreditar num timeout que o outro nao tem. Este e tambem o
;  formato dos outros projetos do laboratorio (ver LimbIA), e faz
;  `pio run` compilar as duas placas de uma vez, inclusive no CI.
;
;  Compilar:       pio run
;  Gravar por USB: pio run -e corpo   -t upload   (SEMPRE com -e)
;                  pio run -e cerebro -t upload
;  Monitorar:      pio device monitor -b 115200
; =====================================================================

[platformio]
; Gravar sem -e tentaria gravar todas na mesma porta, uma depois da
; outra - por isso a gravacao e sempre com -e.
;
; `cerebro_cam` esta aqui porque e a placa que RODA hoje, enquanto a
; XIAO S3 Sense esta noutro projeto. Deixar de fora faria o CI parar
; de olhar justamente o firmware em uso.
default_envs = corpo, cerebro, cerebro_cam, autoteste, teste_som

[env]
; Arduino core 3.x, exigido pelo projeto: a API de PWM deste firmware
; e `ledcAttach(pino, freq, bits)`, que so existe do 3.0 em diante. A
; plataforma oficial do PlatformIO parou no core 2.0.17, entao o core
; 3.x vem do fork pioarduino.
;
; A VERSAO E FIXA de proposito. Firmware que compila hoje precisa
; compilar igual daqui a seis meses, na maquina de outra pessoa e no
; CI - e "a ultima versao" nao e a mesma coisa em duas datas.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; esp32_exception_decoder traduz o backtrace de um panic em
; arquivo:linha. Sem ele, uma excecao vira endereco hexadecimal puro.
monitor_filters =
    esp32_exception_decoder
    time

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1

; O `include/` e do projeto inteiro: e la que moram `protocolo.h` e os
; dois arquivos de configuracao.
build_unflags =

; ---------------------------------------------------------------------
;  O CORPO - ESP32-C3 SuperMini
;
;  Um nucleo RISC-V a 160 MHz, sem PSRAM. Ele nao processa audio e nao
;  usa Wi-Fi: so movimento. Essa pobreza e a feature - o que roda aqui
;  nao tem como ser atrasado por rede.
;
;  ARDUINO_USB_CDC_ON_BOOT=1 nao e conforto: o enlace com o cerebro
;  ocupa os pinos 20 e 21, que sao os do UART0. Sem o console no USB,
;  o log de boot sairia dentro do enlace.
; ---------------------------------------------------------------------
[env:corpo]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_src_filter = +<main_corpo.cpp>

; ---------------------------------------------------------------------
;  O CEREBRO - XIAO ESP32-S3 Sense
;
;  Dois nucleos a 240 MHz e 8 MB de PSRAM octal. A PSRAM e requisito,
;  nao extra: sem ela a camera nao aloca frame buffer decente e o
;  audio nao tem onde guardar alguns segundos de fala.
;
;  `memory_type = qio_opi` e o que habilita a PSRAM OCTAL desta placa.
;  Com o valor errado a placa sobe, a camera falha, e o erro aparece
;  como "camera init failed" - sem nenhuma mencao a memoria.
; ---------------------------------------------------------------------
[env:cerebro]
board = seeed_xiao_esp32s3
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
build_src_filter = +<main_cerebro.cpp>

; ---------------------------------------------------------------------
;  O CEREBRO NA ESP32-CAM - o plano B, e o que roda hoje
;
;  Ha UMA XIAO S3 Sense no laboratorio e tres projetos a querem. Esta
;  placa e o que destrava o robo enquanto a Sense estiver em outro.
;
;  Mesmo `main_cerebro.cpp`: muda so a pinagem, escolhida pelo flag
;  -DCEREBRO_CAM. Voltar para a Sense e tirar esse flag.
;
;  O que se perde esta escrito em include/config_cerebro_cam.h, na
;  secao "O QUE ESTA PLACA NAO FAZ". A perda que muda o projeto: ESP32
;  classico nao roda ESP-SR, entao nao ha palavra "para" reconhecida
;  sem rede.
;
;  Sem USB nativo: grava pela UART0, com o GPIO0 no GND.
;    pio run -e cerebro_cam -t upload --upload-port COM6
; ---------------------------------------------------------------------
[env:cerebro_cam]
board = esp32cam
; DUAS particoes de aplicacao (1,9 MB cada), e nao a `huge_app` padrao
; desta placa, que tem uma so. A segunda e onde o firmware novo e
; gravado quando ele chega pelo enlace (src/atualiza_serial.h): sem
; ela, trocar firmware com o robo montado exige o adaptador, e o
; adaptador exige desmontar o robo.
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DCEREBRO_CAM
    -DBOARD_HAS_PSRAM
build_src_filter = +<main_cerebro.cpp>

; ---------------------------------------------------------------------
;  TESTE_SOM - a ESP32-CAM so com microfone e enlace
;
;  O teste simples: uma palma faz o robo andar 1,5 s e parar. Sem
;  camera, sem Wi-Fi, sem servo. Prova microfone, enlace e ponte H
;  separados no console. O corpo roda o firmware normal (`corpo`).
;
;  Gravar com o robo montado, pelo USB do corpo:
;    pio run -e teste_som
;    python scripts/grava_pelo_enlace.py
;  Gravar pelo adaptador (a primeira vez, ou se o de cima falhar):
;    pio run -e teste_som -t upload --upload-port COM6
; ---------------------------------------------------------------------
[env:teste_som]
extends = env:cerebro_cam
build_src_filter = +<main_teste_som.cpp>

; ---------------------------------------------------------------------
;  BANCADA - o mesmo corpo, falando pelos cotovelos.
;  E aqui que se acompanha comando a comando enquanto se mede corrente
;  e se ajusta o robo na mesa.
; ---------------------------------------------------------------------
[env:bancada]
extends   = env:corpo
build_type = debug
build_flags =
    ${env:corpo.build_flags}
    -DCORE_DEBUG_LEVEL=4

; ---------------------------------------------------------------------
;  AUTOTESTE - a logica das duas placas, numa placa nua
;
;  Sem ponte H, sem servo, sem cabo entre as placas. Exercita parser,
;  regra do failsafe, leitor de linha, montagem de comando, conta de
;  pulso do servo e rampa. Roda no C3 porque e a placa mais fraca das
;  duas: o que couber e for rapido aqui, cabe la.
; ---------------------------------------------------------------------
[env:autoteste]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFEIJAO_AUTOTESTE=1
build_src_filter = +<main_autoteste.cpp>

; ---------------------------------------------------------------------
;  A biblioteca compartilhada do laboratorio (jaspa-core) ainda NAO e
;  usada aqui, pelo mesmo motivo do FarmIO e do LimbIA: ela mora no
;  repositorio Jaspy, que e privado, e o caminho por symlink depende do
;  layout de pastas da maquina - o CI deste repositorio nao resolveria.
;
;  Para desenvolver com ela localmente, com o Jaspy clonado ao lado:
;    lib_deps = symlink://../Jaspy-main/firmware/jaspa-core
; ---------------------------------------------------------------------
